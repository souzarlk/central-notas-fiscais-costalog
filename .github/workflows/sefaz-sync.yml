name: Sincronização automática de NF-e da Costalog

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: costalog-sefaz-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Consultar distribuição DF-e da SEFAZ
        env:
          COSTALOG_SYNC_TOKEN: ${{ secrets.COSTALOG_SYNC_TOKEN }}
        run: |
          if [ -z "${COSTALOG_SYNC_TOKEN:-}" ]; then
            echo "::error::Cadastre o secret COSTALOG_SYNC_TOKEN no GitHub."
            exit 1
          fi
          curl --silent --show-error --fail-with-body \
            --max-time 600 \
            --request POST \
            --header "Authorization: Bearer ${COSTALOG_SYNC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://central-notas-fiscais-costalog-api.onrender.com/api/sefaz/sync"
